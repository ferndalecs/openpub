[package]
name = "openpub"
version = "0.2.1"
edition = "2024"
description = "Viewer and editor for Microsoft Publisher files"
license = "MIT"
repository = "https://github.com/ferndalecs/openpub"

[dependencies]
base64 = "0.22"
openpub-core = { path = "../core" }
rfd = "0.18.0"
serde_json = "1.0.154"
tao = "0.37.2"
winreg = "0.56.0"
wry = "0.57.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = "0.62"
