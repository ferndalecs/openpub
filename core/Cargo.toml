[package]
name = "openpub-core"
version = "0.3.15"
edition = "2024"
description = "Reads Microsoft Publisher .pub files into a renderable document model"
license = "MIT"
repository = "https://github.com/ferndalecs/openpub"

[dependencies]
base64 = "0.22"
cfb = "0.10"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange"] }
